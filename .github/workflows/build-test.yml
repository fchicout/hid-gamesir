name: Kernel Module Build & Test

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Kernel Module
    runs-on: ubuntu-latest

    strategy:
      matrix:
        kernel-pkg:
          - linux-headers-generic

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies & Kernel Headers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential kmod ${{ matrix.kernel-pkg }}

      - name: Build hid-gamesir Module
        run: |
          make

      - name: Verify Module Metadata
        run: |
          modinfo hid-gamesir.ko

      - name: Check Coding Style (clang-format)
        run: |
          if command -v clang-format &> /dev/null; then
            clang-format --dry-run src/*.c src/*.h || true
          fi
