# SonarQube Project Configuration for hid-gamesir
sonar.projectKey=hid-gamesir
sonar.projectName=hid_gamesir
sonar.projectVersion=0.1.0

# Source directories (C driver, Python tools & utilities, maintenance scripts)
sonar.sources=src,tools,scripts
sonar.sourceEncoding=UTF-8

# File inclusions
sonar.inclusions=src/**,tools/**,scripts/**
sonar.c.file.suffixes=.c,.h
sonar.python.version=3.10,3.11,3.12,3.13

# External static analysis report (Cppcheck, Flawfinder)
sonar.externalIssuesReportPaths=sonar-issues.json

# C / C++ Build Wrapper output
sonar.cfamily.build-wrapper-output=bw-output
